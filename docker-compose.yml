services:
    frontend-dev:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: creative-manager-frontend-dev
        ports:
            - "5173:5173"
        environment:
            - NODE_ENV=development
            - VITE_API_URL=http://localhost:3000
        command: npm run dev -- --host
        volumes:
            - .:/app

            - /app/node_modules
        restart: unless-stopped

    frontend-prod:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        container_name: creative-manager-frontend-prod
        ports:
            - "8080:80"
        restart: unless-stopped
        profiles:
            - prod